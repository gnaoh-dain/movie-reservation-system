openapi: 3.0.3
info:
  title: Movie Reservation System
  version: 1.0.0
servers:
  - url: http://localhost:4000
tags:
  - name: Auth
  - name: Movies
  - name: Genres
  - name: Misc

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
  schemas:
    Genre:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Sci-Fi }
        deletedAt: { type: string, format: date-time, nullable: true }
    Movie:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: Blade Runner 2049 }
        description: { type: string }
        posterImageId: { type: string, nullable: true }
        genreId: { type: string, format: uuid }
        genre: { $ref: '#/components/schemas/Genre' }
        deletedAt: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }

security:
  - cookieAuth: []

paths:
  /health:
    get:
      tags: [Misc]
      summary: Health check
      security: []
      responses:
        '200': { description: OK }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, confirmPassword]
              properties:
                email: { type: string, format: email, example: newuser@movie.local }
                password: { type: string, example: Password123! }
                confirmPassword: { type: string, example: Password123! }
      responses:
        '201': { description: Created }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (sets httpOnly accessToken cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@movie.local }
                password: { type: string, example: Password123! }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security: []
      responses:
        '200': { description: Logout successful }

  /api/movies:
    get:
      tags: [Movies]
      summary: List movies (ADMIN)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: genreId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string }, example: godfather }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      tags: [Movies]
      summary: Create movie (ADMIN)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, genreId, poster]
              properties:
                title: { type: string, example: Blade Runner 2049 }
                description: { type: string, example: A young blade runner uncovers a secret that could tip the balance of society. }
                genreId: { type: string, format: uuid }
                poster: { type: string, format: binary }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Movie' } } } }
        '400': { description: Poster image is required }

  /api/movies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Movies]
      summary: Get movie by id (ADMIN)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Movie' } } } }
        '404': { description: MovieNotFound }
    put:
      tags: [Movies]
      summary: Update movie (ADMIN) - at least one field or a poster
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string, example: "Blade Runner 2049 (Director's Cut)" }
                description: { type: string }
                genreId: { type: string, format: uuid }
                poster: { type: string, format: binary }
      responses:
        '200': { description: Updated }
        '400': { description: Nothing to update }
        '404': { description: MovieNotFound }
    delete:
      tags: [Movies]
      summary: Soft-delete movie (ADMIN)
      responses:
        '200': { description: Deleted }
        '404': { description: MovieNotFound }

  /api/genres:
    get:
      tags: [Genres]
      summary: List genres
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: orderBy, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
    post:
      tags: [Genres]
      summary: Create genre (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Documentary }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Genre' } } } }
        '403': { description: Forbidden }
        '409': { description: GenreAlreadyExists }

  /api/genres/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Genres]
      summary: Get genre by id
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Genre' } } } }
        '404': { description: GenreNotFound }
    put:
      tags: [Genres]
      summary: Update genre (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Docu-drama }
      responses:
        '200': { description: Updated }
        '404': { description: GenreNotFound }
        '409': { description: AlreadyExists }
    delete:
      tags: [Genres]
      summary: Soft-delete genre (ADMIN)
      responses:
        '200': { description: Deleted }
        '404': { description: GenreNotFound }

  /api/image/{filename}:
    get:
      tags: [Misc]
      summary: Serve uploaded image
      security: []
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string }, example: poster-1234567890-123456789.jpg }
      responses:
        '200': { description: Image }
        '404': { description: Image not found }
